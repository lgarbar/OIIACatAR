name: OIIACatAR
options:
  bundleIdPrefix: com.lgarbar
  deploymentTarget:
    iOS: "17.0"

targets:
  OIIACatAR:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OIIACatAR
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lgarbar.OIIACatAR
        INFOPLIST_KEY_NSCameraUsageDescription: "Camera access is required to place your AR cat in the room."
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
